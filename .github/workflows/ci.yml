name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bash-syntax:
    name: Bash syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: bash -n
        run: |
          set -e
          for f in scripts/linux/*.sh; do
            echo "::group::$f"
            bash -n "$f"
            echo "::endgroup::"
          done

  shellcheck:
    name: ShellCheck (bash scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ShellCheck
        run: shellcheck scripts/linux/*.sh tests/*.sh

  bash-tests:
    name: Bash argument tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run bash test suite
        run: ./tests/bash-args.test.sh

  pester:
    name: Pester (PowerShell convention tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run Pester
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module -Name Pester -Force -Scope CurrentUser -Repository PSGallery -SkipPublisherCheck -MinimumVersion 5.0.0

          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  psscriptanalyzer:
    name: PSScriptAnalyzer (PowerShell scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

          $results = @('./scripts', './tests') | ForEach-Object {
              Invoke-ScriptAnalyzer -Path $_ -Recurse -Settings ./scripts/PSScriptAnalyzerSettings.psd1
          }

          if ($results) {
              $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize |
                  Out-String -Width 300 | Write-Host
              Write-Host "::error::$($results.Count) PSScriptAnalyzer finding(s) - see table above."
              exit 1
          }

          Write-Host "No PSScriptAnalyzer findings."

  powershell-syntax:
    name: PowerShell parser check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse every .ps1 file
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hadErrors = $false
          Get-ChildItem -Path ./scripts -Filter *.ps1 -Recurse | ForEach-Object {
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
              if ($parseErrors.Count -gt 0) {
                  $hadErrors = $true
                  foreach ($e in $parseErrors) {
                      Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
                  }
              } else {
                  Write-Host "OK: $($_.FullName)"
              }
          }
          if ($hadErrors) { exit 1 }
